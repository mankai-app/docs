name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure custom domain
        run: |
          node -e '
            const fs = require("node:fs");
            const site = process.env.SITE_URL;
            if (!site) throw new Error("Set the SITE_URL repository variable to your custom domain URL.");
            fs.writeFileSync("public/CNAME", new URL(site).hostname + "\n");
          '

      - name: Install, build, and upload site
        uses: withastro/action@v6
        with:
          node-version: '22'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
